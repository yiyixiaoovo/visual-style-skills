<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>网页头图 / WEB HERO — R8</title>
<link rel="stylesheet" href="../assets/ak.css">
<style>
  .ak-page { padding: 0; width: 1920px; height: 1080px; min-height: 0; }
  .nav { position: absolute; left: 72px; right: 72px; top: 40px; display: flex;
         align-items: center; justify-content: space-between; z-index: 6; }
  .hero { position: absolute; left: 72px; top: 176px; width: 1000px; z-index: 5; }
  .kick { display: flex; align-items: center; gap: 12px; }
  .sq { width: 12px; height: 12px; background: var(--ak-accent); flex: none; }
  .title { margin-top: 26px; font-size: 196px; line-height: .8; letter-spacing: -.06em; }
  .title__out { color: transparent; -webkit-text-stroke: 2px var(--ak-paper); margin-left: .04em; }
  .zh { margin-top: 34px; display: flex; align-items: baseline; gap: 22px; }
  .zh__t { font-size: 56px; letter-spacing: .16em; }
  .lead { margin-top: 26px; width: 620px; font-size: 17px; line-height: 1.9; color: var(--ak-paper-2); }
  .cta { margin-top: 38px; display: inline-flex; align-items: center; gap: 16px; }
  .cta__box { padding: 16px 26px; border: 1px solid var(--ak-line-strong); }

  .plate { position: absolute; right: 72px; top: 120px; width: 700px; height: 780px; z-index: 3; }
  .plate__svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .plate__edge { position: absolute; inset: 0; border: 1px solid var(--ak-line); }
  .plate__cap { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex;
                justify-content: space-between; font-family: var(--ak-font-mono); font-size: 9px;
                letter-spacing: .24em; color: var(--ak-paper-2); text-transform: uppercase; }

  .dock { position: absolute; left: 0; right: 0; bottom: 0; height: 128px; z-index: 7;
          background: var(--ak-plate); border-top: 1px solid var(--ak-line);
          display: flex; align-items: center; gap: 64px; padding: 0 72px; }
  .dock .ak-field__v { font-size: 20px; }
  @media (max-width: 1023px) {
    .ak-page { width: 100vw; height: auto; min-height: 0; }
    .nav { position: static; padding: 20px 24px; flex-wrap: wrap; gap: 12px; }
    .hero { position: static; width: 100%; max-width: 100vw; box-sizing: border-box; padding: 40px 24px 0; }
    .title { font-size: clamp(56px, 13vw, 150px); }
    .zh { flex-wrap: wrap; gap: 10px; }
    .lead { width: auto; max-width: 100%; }
    .plate { position: relative; right: auto; top: auto; width: calc(100% - 48px);
             height: 52vw; margin: 32px 24px 0; }
    .dock { position: static; height: auto; flex-wrap: wrap; padding: 20px 24px; gap: 20px; }
    .barcode { display: none; }
  }
  @media (max-width: 1023px) { body { overflow-x: hidden; } }
</style>
</head>
<body class="ak" data-mode="dark" data-faction="rhodes">
<main class="ak-page">
  <div class="ak-crop" style="inset:24px"></div>

  <header class="nav">
    <div class="ak-row" style="gap:14px"><div class="ak-crosshair"></div>
      <span class="ak-label ak-label--bright">RHODES ISLAND · TERMINAL</span></div>
    <div class="ak-row" style="gap:28px">
      <span class="ak-label">档案</span><span class="ak-label">行动</span><span class="ak-label">联络</span>
      <span class="ak-label" style="color:var(--ak-status)"><span class="ak-dot" style="background:currentColor"></span> 在线</span>
    </div>
  </header>

  <section class="hero">
    <div class="kick">
      <span class="sq"></span>
      <span class="ak-label ak-label--bright ak-label--hard">OPERATION 07 / 新章节</span>
    </div>
    <h1 class="title ak-mega">SILENT<br><span class="title__out">PROTOCOL</span></h1>
    <div class="zh">
      <span class="zh__t ak-zh ak-zh--wide">静默协议</span>
      <span class="ak-label">一次没有回声的撤离行动</span>
    </div>
    <p class="lead">第四竖井的信号在三日前中断。回收队将在 04:00 进入矿区，全程无线电静默——任何主动呼叫都将被视为已暴露。</p>
    <div class="cta">
      <span class="cta__box ak-label ak-label--bright">进入行动</span>
      <span class="ak-label">04:00 开始 · 剩余 6 小时</span>
    </div>
  </section>

  <figure class="plate">
    <div class="ak-plate" style="width:100%;height:100%"></div>
    <svg class="plate__svg" viewBox="0 0 700 780" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <clipPath id="h8"><circle cx="350" cy="300" r="118"/></clipPath>
        <linearGradient id="f8" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#08090a" stop-opacity="0"/>
          <stop offset=".62" stop-color="#08090a" stop-opacity="0"/>
          <stop offset="1" stop-color="#08090a" stop-opacity=".92"/>
        </linearGradient>
      </defs>
      <g fill="none" stroke="var(--ak-paper)" stroke-opacity=".16">
        <circle cx="350" cy="300" r="176"/><circle cx="350" cy="300" r="206" stroke-opacity=".07"/>
      </g>
      <path d="M-30 780 C-10 560 80 420 350 396 C620 420 710 560 730 780 Z" fill="var(--ak-paper)" fill-opacity=".93"/>
      <circle cx="350" cy="300" r="118" fill="var(--ak-paper)" fill-opacity=".93"/>
      <g clip-path="url(#h8)">
        <rect x="200" y="272" width="300" height="42" fill="#08090a"/>
        <line x1="200" y1="314" x2="500" y2="314" stroke="var(--ak-accent)" stroke-width="2"/>
      </g>
      <rect x="0" y="470" width="700" height="310" fill="url(#f8)"/>
      <g stroke="var(--ak-paper)" stroke-opacity=".5" stroke-width="1">
        <line x1="350" y1="70" x2="350" y2="92"/>
        <line x1="150" y1="300" x2="172" y2="300"/>
        <line x1="528" y1="300" x2="550" y2="300"/>
      </g>
    </svg>
    <div class="plate__edge"></div>
    <figcaption class="plate__cap"><span>FIG. 07 — SUBJECT</span><span>SCAN 1:1</span></figcaption>
  </figure>

  <footer class="dock">
    <div class="ak-field"><span class="ak-field__k">SECTOR / 区域</span>
      <span class="ak-field__v ak-zh">S-07 废弃矿区</span></div>
    <div class="ak-field"><span class="ak-field__k">CLEARANCE / 权限</span>
      <span class="ak-field__v">B — RESTRICTED</span></div>
    <div class="ak-field"><span class="ak-field__k">STATUS / 状态</span>
      <span class="ak-field__v" style="color:var(--ak-status)">● ACTIVE</span></div>
    <div style="margin-left:auto" class="ak-row">
      <div class="ak-barcode" style="width:180px"></div>
      <span class="ak-num" style="font-size:9px;letter-spacing:.3em;color:var(--ak-paper-2)">AK·WH·07·1225</span>
    </div>
  </footer>
</main>
</body>
</html>
