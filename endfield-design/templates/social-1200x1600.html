<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>竖版社交图 / SOCIAL VERTICAL — 终末地</title>
<link rel="stylesheet" href="../assets/ef.css">
<style>
  .social { width: 1200px; height: 1600px; padding: 72px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand__mark { width: 28px; height: 28px; background: var(--ef-yellow); clip-path: polygon(0 0,100% 0,0 100%); }
  .brand__t { font-size: 16px; font-weight: 700; letter-spacing: .36em; text-transform: uppercase; }
  .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .kicker { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .kicker__k { font-family: var(--ef-font-mono); font-size: 12px; letter-spacing: .3em;
               text-transform: uppercase; color: var(--ef-yellow); }
  .title { font-size: 150px; line-height: .84; letter-spacing: -.05em; text-transform: uppercase; font-weight: 700; }
  .title em { font-style: normal; color: transparent; -webkit-text-stroke: 2px var(--ef-ink); }
  .zh { margin-top: 26px; font-size: 34px; letter-spacing: .14em; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 44px; }
  .card { background: var(--ef-panel-2); border: 1px solid var(--ef-line);
          border-radius: var(--ef-r-pill-lg); padding: 26px 28px; }
  .card__k { font-family: var(--ef-font-mono); font-size: 10px; letter-spacing: .22em;
             text-transform: uppercase; color: var(--ef-ink-2); }
  .card__v { margin-top: 10px; font-size: 38px; font-variant-numeric: tabular-nums; }
  .tail { display: flex; align-items: center; justify-content: space-between; }
  .tri-a { position: absolute; right: 40px; top: 8%; width: 120px; height: 104px;
           background: var(--ef-yellow); clip-path: polygon(50% 0,100% 100%,0 100%); }
  .tri-b { position: absolute; right: 210px; top: 26%; width: 62px; height: 54px;
           background: var(--ef-magenta); clip-path: polygon(50% 0,100% 100%,0 100%); opacity: .85; }
</style>
</head>
<body class="ef">
<main class="ef-page social" style="height:1600px">
  <div class="ef-glow ef-glow--y" style="width:700px;height:700px;left:-240px;bottom:-200px"></div>
  <div class="ef-glow ef-glow--m" style="width:420px;height:420px;right:-120px;top:-140px;opacity:.2"></div>

  <header class="head">
    <div class="brand"><span class="brand__mark"></span><span class="brand__t">Endfield</span></div>
    <span class="ef-chip ef-chip--g"><span class="ef-dot"></span>Live</span>
  </header>

  <section class="hero">
    <div class="tri-a"></div><div class="tri-b"></div>
    <div class="kicker"><span class="ef-band" style="width:48px"></span>
      <span class="kicker__k">Protocol Zero / 第一阶段</span></div>
    <h1 class="title">PROTOCOL<br><em>ZERO</em></h1>
    <div class="zh ef-zh">零号协议 · 终末地</div>
    <div class="cards">
      <div class="card"><div class="card__k">Progress</div><div class="card__v" style="color:var(--ef-yellow)">68%</div></div>
      <div class="card"><div class="card__k">Risk</div><div class="card__v" style="color:var(--ef-magenta)">03</div></div>
    </div>
  </section>

  <footer class="tail">
    <span class="ef-pill ef-pill--y">开始同步</span>
    <span class="ef-label">S-04 · 12 UNITS · 04:20</span>
  </footer>
</main>
</body>
</html>
